<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Adoption Maturity Scorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --surface: #f5f5f4;
      --border: #e5e5e3;
      --border-strong: #d4d4d2;
      --text-primary: #1a1a18;
      --text-secondary: #6b6b68;
      --text-muted: #9d9d9a;
      --accent: #2563eb;
      --accent-bg: #eff6ff;
      --accent-border: #bfdbfe;
      --accent-text: #1d4ed8;
      --radius: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111110;
        --surface: #1c1c1a;
        --border: #2a2a28;
        --border-strong: #3a3a38;
        --text-primary: #f5f5f3;
        --text-secondary: #a8a8a5;
        --text-muted: #6b6b68;
        --accent: #3b82f6;
        --accent-bg: #172554;
        --accent-border: #1e40af;
        --accent-text: #93c5fd;
      }
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .container { width: 100%; max-width: 560px; }

    .progress-bar { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 2.5rem; }
    .progress-fill { height: 3px; border-radius: 2px; background: var(--accent); transition: width 0.4s ease; }

    .q-label { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem; }
    .q-text { font-size: 18px; font-weight: 500; color: var(--text-primary); margin-bottom: 1.5rem; line-height: 1.4; }

    .option-btn {
      display: block; width: 100%; text-align: left;
      padding: 0.75rem 1rem; margin-bottom: 0.5rem;
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius); font-size: 14px; font-family: inherit;
      color: var(--text-primary); cursor: pointer;
      transition: border-color 0.15s, background 0.15s; line-height: 1.4;
    }
    .option-btn:hover { border-color: var(--accent-border); background: var(--accent-bg); color: var(--accent-text); }
    .option-btn.selected { border-color: var(--accent); background: var(--accent-bg); color: var(--accent-text); }

    .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; }
    .nav-btn {
      padding: 0.5rem 1.25rem; border: 0.5px solid var(--border-strong);
      border-radius: var(--radius); background: transparent; color: var(--text-primary);
      font-size: 14px; font-family: inherit; cursor: pointer;
    }
    .nav-btn:hover { background: var(--surface); }
    .nav-btn.primary { background: var(--text-primary); color: var(--bg); border-color: var(--text-primary); }
    .nav-btn.primary:hover { opacity: 0.85; }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .score-counter { font-size: 13px; color: var(--text-muted); }

    .dept-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 1.5rem; }
    .dept-btn {
      padding: 0.9rem 0.75rem; background: var(--surface);
      border: 0.5px solid var(--border); border-radius: var(--radius);
      font-size: 13px; font-family: inherit; color: var(--text-primary);
      cursor: pointer; text-align: center; transition: all 0.15s;
    }
    .dept-btn:hover { border-color: var(--accent-border); background: var(--accent-bg); color: var(--accent-text); }
    .dept-btn.selected { border-color: var(--accent); background: var(--accent-bg); color: var(--accent-text); font-weight: 500; }
    .dept-icon { font-size: 20px; display: block; margin-bottom: 6px; }

    .intro-title { font-size: 22px; font-weight: 500; color: var(--text-primary); margin-bottom: 0.5rem; }
    .intro-sub { font-size: 15px; color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.6; }

    .level-badge { display: inline-block; padding: 4px 12px; border-radius: var(--radius); font-size: 12px; font-weight: 500; margin-bottom: 1rem; }
    .level-label { font-size: 24px; font-weight: 500; color: var(--text-primary); margin-bottom: 0.25rem; }
    .score-bar { height: 5px; background: var(--border); border-radius: 3px; margin-bottom: 1.5rem; }
    .score-bar-fill { height: 5px; border-radius: 3px; background: var(--accent); transition: width 0.7s ease; }

    .dimension-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1.5rem; }
    .dim-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 0.6rem 0.75rem; }
    .dim-name { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
    .dim-row { display: flex; align-items: center; gap: 8px; }
    .dim-bar-bg { flex: 1; height: 3px; background: var(--border); border-radius: 2px; }
    .dim-bar-fill { height: 3px; border-radius: 2px; background: var(--accent); }
    .dim-score { font-size: 12px; font-weight: 500; color: var(--text-primary); min-width: 30px; text-align: right; }

    .divider { border: none; border-top: 0.5px solid var(--border); margin: 1.5rem 0; }
    .section-label { font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.75rem; }

    .ai-output { font-size: 14px; color: var(--text-primary); line-height: 1.8; white-space: pre-wrap; }

    .loading-state { padding: 2.5rem 0; text-align: center; }
    .loading-text { font-size: 14px; color: var(--text-secondary); margin-top: 1rem; }
    .spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .stream-cursor { display: inline-block; width: 2px; height: 14px; background: var(--accent); margin-left: 2px; vertical-align: middle; animation: blink 0.9s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .error-box { background: #fef2f2; border: 0.5px solid #fecaca; border-radius: var(--radius); padding: 1rem; font-size: 14px; color: #991b1b; margin-top: 1rem; }
    @media (prefers-color-scheme: dark) { .error-box { background: #2d1515; border-color: #7f1d1d; color: #fca5a5; } }

    .restart-row { text-align: center; margin-top: 2rem; }
  </style>
</head>
<body>
<div class="container">
  <div id="app"></div>
</div>

<script>
const departments = [
  { id: "product", label: "Product", icon: "🧭" },
  { id: "sales", label: "Sales", icon: "📈" },
  { id: "support", label: "Customer Support", icon: "🎧" },
  { id: "marketing", label: "Marketing", icon: "📣" },
  { id: "operations", label: "Operations", icon: "⚙️" },
  { id: "finance", label: "Finance", icon: "💰" },
  { id: "engineering", label: "Engineering", icon: "🛠️" },
  { id: "hr", label: "People & HR", icon: "🤝" }
];

const questions = [
  { id: "q1", dim: "Strategy", text: "How does your team currently approach AI adoption?", options: [
    { text: "No formal approach — individuals experiment on their own", score: 1 },
    { text: "Some conversations happening, but no clear owner or plan", score: 2 },
    { text: "A strategy exists but isn't consistently followed", score: 3 },
    { text: "Clear AI priorities with defined ownership and milestones", score: 4 }
  ]},
  { id: "q2", dim: "Strategy", text: "Who owns AI initiatives in your team?", options: [
    { text: "Nobody — it happens organically or not at all", score: 1 },
    { text: "IT or engineering by default, not by design", score: 2 },
    { text: "A dedicated person, but cross-functional buy-in is limited", score: 3 },
    { text: "A cross-functional role with leadership mandate", score: 4 }
  ]},
  { id: "q3", dim: "Enablement", text: "How confident is your team using AI tools day-to-day?", options: [
    { text: "Most people haven't tried or feel intimidated", score: 1 },
    { text: "A few power users, but most colleagues don't engage", score: 2 },
    { text: "Decent adoption, but skills vary widely and training is ad hoc", score: 3 },
    { text: "Regular training and playbooks — most team members use AI confidently", score: 4 }
  ]},
  { id: "q4", dim: "Enablement", text: "How does your team handle prompts and AI workflow design?", options: [
    { text: "People write prompts ad hoc and share nothing", score: 1 },
    { text: "Some informal sharing, but no reusable library", score: 2 },
    { text: "A prompt library exists but isn't maintained or widely used", score: 3 },
    { text: "Curated, tested prompt libraries with regular team reviews", score: 4 }
  ]},
  { id: "q5", dim: "Measurement", text: "How do you measure the impact of AI on your team's work?", options: [
    { text: "We don't — it's purely anecdotal", score: 1 },
    { text: "Some informal feedback, but no structured metrics", score: 2 },
    { text: "KPIs tracked in some areas, but inconsistently defined", score: 3 },
    { text: "A clear framework tracking usage, productivity, and business outcomes", score: 4 }
  ]},
  { id: "q6", dim: "Governance", text: "How does your team handle data privacy when using AI tools?", options: [
    { text: "No policies — people use whatever tools they want", score: 1 },
    { text: "Some restrictions but no clear AI-specific guidelines", score: 2 },
    { text: "Written guidelines exist, but shadow AI use is likely happening", score: 3 },
    { text: "Active governance with approved tools, data rules, and regular audits", score: 4 }
  ]},
  { id: "q7", dim: "Workflows", text: "How embedded is AI in your core team workflows?", options: [
    { text: "Not embedded — AI is separate from how work gets done", score: 1 },
    { text: "Used for isolated tasks (writing, summarising) but not integrated", score: 2 },
    { text: "Integrated in a few workflows with measurable impact", score: 3 },
    { text: "AI is part of multiple critical workflows with defined ROI", score: 4 }
  ]},
  { id: "q8", dim: "Culture", text: "How does your team leadership talk about AI?", options: [
    { text: "Rarely or never — it's not seen as a priority", score: 1 },
    { text: "Occasional mentions but no consistent message or investment", score: 2 },
    { text: "Leadership supports AI in principle but doesn't actively drive it", score: 3 },
    { text: "AI is a visible priority — leadership champions it actively", score: 4 }
  ]}
];

const levels = [
  { name: "Reactive", range: [8, 14], badge: { bg: "#F09595", text: "#501313" } },
  { name: "Aware", range: [15, 22], badge: { bg: "#FAC775", text: "#412402" } },
  { name: "Scaling", range: [23, 28], badge: { bg: "#9FE1CB", text: "#04342C" } },
  { name: "Optimising", range: [29, 32], badge: { bg: "#B5D4F4", text: "#042C53" } }
];

const dims = ["Strategy", "Enablement", "Measurement", "Governance", "Workflows", "Culture"];

let step = "dept", selectedDept = null, currentQ = 0, answers = {};

function getLevel(total) {
  return levels.find(l => total >= l.range[0] && total <= l.range[1]) || levels[levels.length - 1];
}

function getDimScores() {
  const scores = {};
  dims.forEach(d => { scores[d] = { total: 0, max: 0 }; });
  questions.forEach(q => {
    if (answers[q.id] !== undefined) scores[q.dim].total += answers[q.id];
    scores[q.dim].max += 4;
  });
  return scores;
}

function buildAnswerSummary() {
  return questions.map(q => {
    const selected = q.options.find(o => o.score === answers[q.id]);
    return `${q.dim} — ${q.text}\nAnswer: ${selected ? selected.text : 'N/A'} (score: ${answers[q.id] || 0}/4)`;
  }).join('\n\n');
}

async function fetchAIRecommendations(dept, total, level, dimScores) {
  const deptLabel = departments.find(d => d.id === dept)?.label || dept;
  const answerSummary = buildAnswerSummary();
  const dimSummary = dims.map(d => `${d}: ${Math.round((dimScores[d].total / dimScores[d].max) * 100)}%`).join(', ');

  const prompt = `You are an expert in enterprise AI adoption strategy, specifically for B2B SaaS and e-mobility scale-ups.

A ${deptLabel} team has completed an AI Adoption Maturity Assessment. Here are their results:

Overall maturity level: ${level.name} (${total}/32)
Dimension scores: ${dimSummary}

Detailed answers:
${answerSummary}

Generate THREE highly specific, opinionated action recommendations tailored for a ${deptLabel} team at this exact maturity level.

Rules:
- Each action must be specific to ${deptLabel} team workflows and daily realities — not generic AI advice
- Reference actual ${deptLabel} use cases (e.g. for Support: ticket triage, CSAT, response time; for Product: spec writing, user research synthesis; for Sales: pipeline intelligence, outreach personalisation)
- Be direct and concrete — name the specific workflow, tool type, or process to change
- If their weakest dimension is obvious from the scores, address it
- Write in a direct, professional tone — no hype, no filler
- Format as three numbered actions, each with a bold header line followed by 2 sentences of specific guidance
- Keep the total response under 250 words`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      stream: true,
      messages: [{ role: "user", content: prompt }]
    })
  });

  if (!response.ok) throw new Error(`API error ${response.status}`);
  return response;
}

function render(html) { document.getElementById('app').innerHTML = html; }

function renderDeptSelect() {
  render(`
    <div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div>
    <div class="intro-title">AI adoption maturity scorer</div>
    <div class="intro-sub">Answer 8 questions and get a department-specific action plan — generated live by Claude based on your exact profile.</div>
    <div class="q-label">Select your department</div>
    <div class="dept-grid">
      ${departments.map(d => `
        <button class="dept-btn${selectedDept === d.id ? ' selected' : ''}" data-id="${d.id}">
          <span class="dept-icon">${d.icon}</span>${d.label}
        </button>`).join('')}
    </div>
    <div style="text-align:right;">
      <button class="nav-btn primary" id="start-btn" ${!selectedDept ? 'disabled' : ''}>Start assessment →</button>
    </div>
  `);

  document.querySelectorAll('.dept-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedDept = btn.dataset.id;
      document.querySelectorAll('.dept-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('start-btn').disabled = false;
    });
  });

  document.getElementById('start-btn').addEventListener('click', () => {
    step = "questions"; currentQ = 0; answers = {};
    renderQuestion();
  });
}

function renderQuestion() {
  const q = questions[currentQ];
  const pct = Math.round((currentQ / questions.length) * 100);
  const deptLabel = departments.find(d => d.id === selectedDept)?.label;

  render(`
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-label">Question ${currentQ + 1} of ${questions.length} · ${q.dim} · ${deptLabel}</div>
    <div class="q-text">${q.text}</div>
    <div id="options">
      ${q.options.map(o => `
        <button class="option-btn${answers[q.id] === o.score ? ' selected' : ''}" data-score="${o.score}">
          ${o.text}
        </button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="back-btn">← Back</button>
      <span class="score-counter">${Object.keys(answers).length} of 8 answered</span>
      <button class="nav-btn primary" id="next-btn" ${answers[q.id] === undefined ? 'disabled' : ''}>
        ${currentQ === questions.length - 1 ? 'Get my plan ↗' : 'Next →'}
      </button>
    </div>
  `);

  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      answers[q.id] = parseInt(btn.dataset.score);
      document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('next-btn').disabled = false;
      document.querySelector('.score-counter').textContent = Object.keys(answers).length + ' of 8 answered';
    });
  });

  document.getElementById('back-btn').addEventListener('click', () => {
    if (currentQ > 0) { currentQ--; renderQuestion(); }
    else { step = "dept"; renderDeptSelect(); }
  });

  document.getElementById('next-btn').addEventListener('click', () => {
    if (currentQ < questions.length - 1) { currentQ++; renderQuestion(); }
    else { renderResult(); }
  });
}

async function renderResult() {
  const total = Object.values(answers).reduce((a, b) => a + b, 0);
  const level = getLevel(total);
  const pct = Math.round(((total - 8) / 24) * 100);
  const dimScores = getDimScores();
  const deptLabel = departments.find(d => d.id === selectedDept)?.label;

  const dimRows = dims.map(d => {
    const s = dimScores[d];
    const dpct = s.max > 0 ? Math.round((s.total / s.max) * 100) : 0;
    return `<div class="dim-card">
      <div class="dim-name">${d}</div>
      <div class="dim-row">
        <div class="dim-bar-bg"><div class="dim-bar-fill" style="width:${dpct}%"></div></div>
        <span class="dim-score">${dpct}%</span>
      </div>
    </div>`;
  }).join('');

  render(`
    <div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
    <span class="level-badge" style="background:${level.badge.bg};color:${level.badge.text};">${level.name} · ${deptLabel}</span>
    <div class="level-label">${total}/32</div>
    <div class="score-bar"><div class="score-bar-fill" style="width:${pct}%"></div></div>
    <div class="section-label">Dimension breakdown</div>
    <div class="dimension-grid">${dimRows}</div>
    <div class="divider"></div>
    <div class="section-label">Your three next moves — tailored for ${deptLabel}</div>
    <div id="ai-output">
      <div class="loading-state">
        <div class="spinner"></div>
        <div class="loading-text">Claude is analysing your ${deptLabel} team's profile...</div>
      </div>
    </div>
    <div class="restart-row" id="restart-row" style="display:none;">
      <button class="nav-btn" id="restart-btn">Start over</button>
    </div>
  `);

  try {
    const response = await fetchAIRecommendations(selectedDept, total, level, dimScores);
    const outputEl = document.getElementById('ai-output');
    outputEl.innerHTML = '<div class="ai-output" id="stream-text"></div>';
    const streamEl = document.getElementById('stream-text');
    const cursor = document.createElement('span');
    cursor.className = 'stream-cursor';
    streamEl.appendChild(cursor);

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const parsed = JSON.parse(data);
          if (parsed.type === 'content_block_delta' && parsed.delta?.type === 'text_delta') {
            fullText += parsed.delta.text;
            streamEl.textContent = fullText;
            streamEl.appendChild(cursor);
          }
        } catch {}
      }
    }

    cursor.remove();
    streamEl.textContent = fullText;
    document.getElementById('restart-row').style.display = 'block';
    document.getElementById('restart-btn').addEventListener('click', () => {
      step = "dept"; selectedDept = null; currentQ = 0; answers = {};
      renderDeptSelect();
    });

  } catch (err) {
    document.getElementById('ai-output').innerHTML = `
      <div class="error-box"><strong>Couldn't connect to Claude API.</strong> Make sure you're running this in an environment where the Anthropic API is accessible. Error: ${err.message}</div>`;
    document.getElementById('restart-row').style.display = 'block';
    document.getElementById('restart-btn').addEventListener('click', () => {
      step = "dept"; selectedDept = null; currentQ = 0; answers = {};
      renderDeptSelect();
    });
  }
}

renderDeptSelect();
</script>
</body>
</html>
